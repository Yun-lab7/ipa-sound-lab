plugins {
    id "com.android.application" version "9.2.0"
}

android {
    namespace "com.soundlab"
    compileSdk 37

    defaultConfig {
        applicationId "com.soundlab"
        minSdk 24
        targetSdk 37
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
